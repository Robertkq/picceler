import os

config.suffixes = ['.mlir']

# This file is copied to <build_dir>/mlir/lit.local.cfg, so its grandparent
# directory is the actual build root regardless of what it's named.
build_dir = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
config.substitutions.append(('%picceler-opt', os.path.join(build_dir, 'picceler-opt')))
