import os

config.suffixes = ['.pic']

# This file is copied to <build_dir>/e2e/lit.local.cfg, so its grandparent
# directory is the actual build root regardless of what it's named.
build_dir = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
config.substitutions.append(('%picceler', os.path.join(build_dir, 'picceler')))
