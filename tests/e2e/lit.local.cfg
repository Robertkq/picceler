import os

config.suffixes = ['.pic']

build_dir = os.path.abspath("../build/")
# picceler resolves its runtime library relative to its own process cwd, so
# %picceler goes through a wrapper that cd's into build_dir first -- see
# picceler-wrapper.sh for details.
config.substitutions.append(('%picceler', os.path.join(build_dir, 'e2e', 'picceler-wrapper.sh')))
